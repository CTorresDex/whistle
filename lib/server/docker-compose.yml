services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audiostation
      POSTGRES_PASSWORD: audiostation
      POSTGRES_DB: audiostation
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiostation"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://audiostation:audiostation@db:5432/audiostation
    volumes:
      - audios:/audios
      - thumbnails:/thumbnails
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  audios:
  thumbnails:
  data:
